name: CI Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'src/inference/**'
      - 'src/scripts/**'
      - 'src/utils/**'
      - 'src/monitoring/**'
      - 'src/models/**'
      - 'src/gpu_training/**'
      - 'docker/**'
      - 'requirements*.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.11' ]

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Run unit tests
      run: |
        pytest tests/ -v --cov=src --cov-report=xml
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main')
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Inference Docker image
      run: |
        docker build -f docker/Dockerfile.inference -t cats-dogs-classifier-inference:${{ github.sha }} .
        docker tag cats-dogs-classifier-inference:${{ github.sha }} cats-dogs-classifier-inference:latest
        echo "Inference image built: cats-dogs-classifier-inference:${{ github.sha }}"
    
    - name: Build Training Docker image
      run: |
        docker build -f docker/Dockerfile.training -t cats-dogs-classifier-training:${{ github.sha }} .
        docker tag cats-dogs-classifier-training:${{ github.sha }} cats-dogs-classifier-training:latest
        echo "Training image built: cats-dogs-classifier-training:${{ github.sha }}"
    
    - name: Test Inference Docker image
      run: |
        docker run --rm -p 8000:8000 -d --name test-inference cats-dogs-classifier-inference:latest
        sleep 10
        echo "Testing Inference health check..."
        docker run --rm --network host alpine/curl curl -f http://localhost:8000/health || echo "Health check status: $(docker logs test-inference | tail -5)"
        docker stop test-inference || true
        echo "Inference image test completed"
    
    - name: Test Training Docker image
      run: |
        echo "Testing Training Docker image..."
        docker run --rm --name test-training cats-dogs-classifier-training:latest python -c "import torch; print(f'PyTorch version: {torch.__version__}'); from src.models import create_model; m = create_model('simple_cnn'); print('Model creation successful')" || echo "Training image test completed"
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Push Inference image to GitHub Container Registry
      run: |
        docker tag cats-dogs-classifier-inference:latest ghcr.io/${{ github.repository_owner }}/cats-dogs-classifier-inference:latest
        docker tag cats-dogs-classifier-inference:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/cats-dogs-classifier-inference:${{ github.sha }}
        docker push ghcr.io/${{ github.repository_owner }}/cats-dogs-classifier-inference:latest
        docker push ghcr.io/${{ github.repository_owner }}/cats-dogs-classifier-inference:${{ github.sha }}
        echo "Inference image pushed to GHCR"
    
    - name: Push Training image to GitHub Container Registry
      run: |
        docker tag cats-dogs-classifier-training:latest ghcr.io/${{ github.repository_owner }}/cats-dogs-classifier-training:latest
        docker tag cats-dogs-classifier-training:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/cats-dogs-classifier-training:${{ github.sha }}
        docker push ghcr.io/${{ github.repository_owner }}/cats-dogs-classifier-training:latest
        docker push ghcr.io/${{ github.repository_owner }}/cats-dogs-classifier-training:${{ github.sha }}
        echo "Training image pushed to GHCR"
    
    - name: Print Build Summary
      run: |
        echo "=========================================="
        echo "CI Pipeline Build Summary"
        echo "=========================================="
        echo "Inference Image:"
        echo "  - Local: cats-dogs-classifier-inference:${{ github.sha }}"
        echo "  - GHCR: ghcr.io/${{ github.repository_owner }}/cats-dogs-classifier-inference:${{ github.sha }}"
        echo ""
        echo "Training Image:"
        echo "  - Local: cats-dogs-classifier-training:${{ github.sha }}"
        echo "  - GHCR: ghcr.io/${{ github.repository_owner }}/cats-dogs-classifier-training:${{ github.sha }}"
        echo "==========================================" 
