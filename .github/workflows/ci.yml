name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.11' ]

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Run unit tests
      run: |
        pytest tests/ -v --cov=src --cov-report=xml
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image
      run: |
        docker build -f docker/Dockerfile -t cats-dogs-classifier:${{ github.sha }} .
        docker build -f docker/Dockerfile -t cats-dogs-classifier:latest .
    
    - name: Test Docker image
      run: |
        docker run --rm -p 8000:8000 -d --name test-container cats-dogs-classifier:latest
        sleep 5
        docker run --rm --network host alpine/curl curl http://localhost:8000/health || true
        docker stop test-container || true
    
    - name: Log in to Docker Hub
      if: secrets.DOCKER_USERNAME != ''
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Push to Docker Hub
      if: secrets.DOCKER_USERNAME != ''
      run: |
        docker tag cats-dogs-classifier:latest ${{ secrets.DOCKER_USERNAME }}/cats-dogs-classifier:latest
        docker tag cats-dogs-classifier:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/cats-dogs-classifier:${{ github.sha }}
        docker push ${{ secrets.DOCKER_USERNAME }}/cats-dogs-classifier:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/cats-dogs-classifier:${{ github.sha }}
