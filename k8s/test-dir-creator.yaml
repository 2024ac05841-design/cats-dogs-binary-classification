apiVersion: v1
kind: Pod
metadata:
  name: test-dir-creator
  namespace: cats-dogs-classification
spec:
  serviceAccountName: training-account
  containers:
  - name: creator
    image: busybox:latest
    command: ['/bin/sh']
    args: ['-c', 'mkdir -p /mnt/training-data/processed/test && echo "Test directories created" && ls -la /mnt/training-data/processed/']
    volumeMounts:
    - name: training-data
      mountPath: /mnt/training-data
  volumes:
  - name: training-data
    persistentVolumeClaim:
      claimName: training-data-pvc
  restartPolicy: Never
