---
# Inference Deployment with MLFlow-based model fetching
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-service
  namespace: cats-dogs-classification
  labels:
    app: inference-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inference-service
  template:
    metadata:
      labels:
        app: inference-service
    spec:
      serviceAccountName: inference-account
      
      containers:
      - name: inference-service
        image: 172.26.195.22:5000/cats-dogs-inference:latest
        imagePullPolicy: Always
        
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        
        env:
        - name: MODEL_PATH
          value: "/app-models/model.pkl"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: MLFLOW_TRACKING_URI
          value: "http://mlflow:5000"
        - name: REGISTERED_MODEL_NAME
          value: "cats-dogs-best-model"
        - name: MODEL_STAGE
          value: "Production"
        - name: EXPERIMENT_NAME
          value: "cats-dogs-k8s"
        
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
        
        volumeMounts:
        - name: app-models
          mountPath: /app-models
      
      volumes:
      - name: app-models
        emptyDir: {}


---
# Inference Service
apiVersion: v1
kind: Service
metadata:
  name: inference-service
  namespace: cats-dogs-classification
  labels:
    app: inference-service
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: inference-service

---
# ServiceAccount for Inference
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inference-account
  namespace: cats-dogs-classification

---
# Role for Inference
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: inference-role
  namespace: cats-dogs-classification
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list"]

---
# RoleBinding for Inference
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: inference-rolebinding
  namespace: cats-dogs-classification
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: inference-role
subjects:
- kind: ServiceAccount
  name: inference-account
  namespace: cats-dogs-classification
