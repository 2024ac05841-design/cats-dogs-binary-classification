apiVersion: batch/v1
kind: CronJob
metadata:
  name: cats-dogs-training
  namespace: cats-dogs-classification
spec:
  # Manual trigger: Run at specific times (adjust as needed)
  # Format: minute hour day month day-of-week
  # To run manually: kubectl create job --from=cronjob/cats-dogs-training manual-training-run -n cats-dogs-classification
  schedule: "0 2 * * 0"  # Runs at 2 AM every Sunday
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  
  jobTemplate:
    metadata:
      labels:
        app: cats-dogs-training
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: cats-dogs-training
        spec:
          serviceAccountName: training-account
          restartPolicy: OnFailure
          
          containers:
          - name: training-job
            image: 172.17.0.2:5000/cats-dogs-trainer:latest
            imagePullPolicy: Always
            
            command:
            - /bin/bash
            - -c
            - |
              cd /app
              python src/scripts/train.py \
                --data-dir /data/processed \
                --best-model-dir /models/best_model \
                --epochs 12 \
                --batch-size 32 \
                --lr 0.001
            
            env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: MLFLOW_TRACKING_URI
              value: "http://mlflow:5000"
            - name: MLFLOW_EXPERIMENT
              value: "cats-dogs-k8s"
            
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                cpu: 2000m
                memory: 4Gi
            
            volumeMounts:
            - name: training-data
              mountPath: /data
            - name: training-models
              mountPath: /models
          
          volumes:
          - name: training-data
            persistentVolumeClaim:
              claimName: mlflow-data-pvc
          - name: training-models
            persistentVolumeClaim:
              claimName: mlflow-data-pvc

---
# ServiceAccount for training job
apiVersion: v1
kind: ServiceAccount
metadata:
  name: training-account
  namespace: cats-dogs-classification

---
# Role for training job
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: training-role
  namespace: cats-dogs-classification
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list"]

---
# RoleBinding for training job
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: training-rolebinding
  namespace: cats-dogs-classification
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: training-role
subjects:
- kind: ServiceAccount
  name: training-account
  namespace: cats-dogs-classification
