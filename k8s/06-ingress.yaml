---
# Ingress for MLFlow and Inference Service
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cats-dogs-ingress
  namespace: cats-dogs-classification
  labels:
    app: cats-dogs
  annotations:
    # For local testing without nginx-ingress controller
    # nginx.ingress.kubernetes.io/rewrite-target: /
    # kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  # MLFlow UI - http://mlflow.local/
  - host: mlflow.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mlflow
            port:
              number: 5000
  
  # Inference API - http://inference.local/
  - host: inference.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: inference-service
            port:
              number: 8000
  
  # Catch-all for localhost access
  - host: localhost
    http:
      paths:
      - path: /mlflow
        pathType: Prefix
        backend:
          service:
            name: mlflow
            port:
              number: 5000
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: inference-service
            port:
              number: 8000

---
# NetworkPolicy for namespace isolation
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cats-dogs-network-policy
  namespace: cats-dogs-classification
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  
  ingress:
  # Allow traffic from same namespace
  - from:
    - namespaceSelector:
        matchLabels:
          name: cats-dogs-classification
  # Allow traffic from ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
  
  egress:
  # Allow traffic to same namespace
  - to:
    - namespaceSelector:
        matchLabels:
          name: cats-dogs-classification
  # Allow DNS
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
  # Allow traffic to external (for model downloads, etc)
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
