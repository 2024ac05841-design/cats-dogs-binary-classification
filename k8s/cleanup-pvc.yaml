apiVersion: v1
kind: Pod
metadata:
  name: pvc-cleanup
  namespace: cats-dogs-classification
spec:
  serviceAccountName: training-account
  containers:
  - name: cleanup
    image: busybox:latest
    command: ['/bin/sh']
    args: ['-c', 'rm -rf /mnt/training-data/* && echo "PVC cleared successfully"']
    volumeMounts:
    - name: training-data
      mountPath: /mnt/training-data
  volumes:
  - name: training-data
    persistentVolumeClaim:
      claimName: training-data-pvc
  restartPolicy: Never
