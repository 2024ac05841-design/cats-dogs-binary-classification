version: '3.8'

services:
  inference-service:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: cats-dogs-classifier
    ports:
      - "9000:8000"
    environment:
      - MODEL_PATH=/app/models/model.pkl
      - PYTHONUNBUFFERED=1
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Optional: MLflow tracking server
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.7.0
    container_name: mlflow-server
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    command: mlflow server --backend-store-uri file:///mlruns --default-artifact-root /mlruns --host 0.0.0.0
    restart: unless-stopped
