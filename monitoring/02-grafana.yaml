---
# Grafana Deployment for dashboards
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: cats-dogs-classification
  labels:
    app: grafana
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      initContainers:
      - name: init-chmod-data
        image: busybox
        command: ["sh", "-c", "chmod -R 777 /var/lib/grafana || true"]
        volumeMounts:
        - name: storage
          mountPath: /var/lib/grafana
      
      containers:
      - name: grafana
        image: grafana/grafana:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: web
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "admin"
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        - name: GF_INSTALL_PLUGINS
          value: ""
        - name: GF_PLUGIN_ADMIN_ENABLED
          value: "false"
        volumeMounts:
        - name: storage
          mountPath: /var/lib/grafana
        - name: provisioning-datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: provisioning-dashboards
          mountPath: /etc/grafana/provisioning/dashboards
        - name: dashboards
          mountPath: /var/lib/grafana/dashboards
        resources:
          requests:
            cpu: 150m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 120
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: grafana-storage-pvc
      - name: provisioning-datasources
        configMap:
          name: grafana-datasources
      - name: provisioning-dashboards
        configMap:
          name: grafana-dashboard-provisioning
      - name: dashboards
        configMap:
          name: grafana-dashboards

---
# Grafana Storage PersistentVolume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: grafana-storage-pv
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteMany
  storageClassName: manual
  hostPath:
    path: /mnt/data/cats-dogs/grafana
    type: DirectoryOrCreate

---
# Grafana Storage PersistentVolumeClaim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-storage-pvc
  namespace: cats-dogs-classification
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: manual
  resources:
    requests:
      storage: 2Gi
  volumeName: grafana-storage-pv

---
# Grafana Service
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: cats-dogs-classification
  labels:
    app: grafana
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    name: web
  selector:
    app: grafana

---
# Grafana Datasources ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: cats-dogs-classification
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        orgId: 1
        url: http://prometheus:9090
        basicAuth: false
        isDefault: true
        editable: true

---
# Grafana Dashboard Provisioning ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provisioning
  namespace: cats-dogs-classification
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'Cats Dogs Dashboards'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards

---
# Grafana Dashboards ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: cats-dogs-classification
data:
  cats-dogs-dashboard.json: |
    {
      "dashboard": {
        "title": "Cats vs Dogs - Training & Inference Monitoring",
        "description": "Unified monitoring dashboard for model training and inference",
        "tags": ["cats-dogs", "training", "inference", "mlflow"],
        "timezone": "browser",
        "schemaVersion": 16,
        "version": 1,
        "refresh": "5s",
        "time": {"from": "now-1h", "to": "now"},
        "panels": [
          {
            "id": 1,
            "title": "Training Status",
            "type": "stat",
            "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
            "targets": [
              {
                "expr": "ALERTS{alertname=~\".*Training.*\", namespace=\"cats-dogs-classification\"}",
                "refId": "A"
              }
            ]
          },
          {
            "id": 2,
            "title": "Pod CPU Usage",
            "type": "graph",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
            "targets": [
              {
                "expr": "rate(container_cpu_usage_seconds_total{namespace=\"cats-dogs-classification\"}[1m])",
                "legendFormat": "{{ pod_name }}",
                "refId": "A"
              }
            ]
          },
          {
            "id": 3,
            "title": "Pod Memory Usage",
            "type": "graph",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
            "targets": [
              {
                "expr": "container_memory_usage_bytes{namespace=\"cats-dogs-classification\"} / 1024 / 1024",
                "legendFormat": "{{ pod_name }} (MB)",
                "refId": "A"
              }
            ]
          },
          {
            "id": 4,
            "title": "Inference Predictions (per minute)",
            "type": "stat",
            "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
            "targets": [
              {
                "expr": "rate(inference_predictions_total{namespace=\"cats-dogs-classification\"}[1m])",
                "refId": "A"
              }
            ]
          },
          {
            "id": 5,
            "title": "Inference Error Rate",
            "type": "stat",
            "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
            "targets": [
              {
                "expr": "rate(inference_errors_total{namespace=\"cats-dogs-classification\"}[1m])",
                "refId": "A"
              }
            ]
          }
        ]
      }
    }
