---
# Grafana Deployment for dashboards
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: cats-dogs-classification
  labels:
    app: grafana
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: web
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "admin"
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        - name: GF_INSTALL_PLUGINS
          value: ""
        - name: GF_PLUGIN_ADMIN_ENABLED
          value: "false"
        volumeMounts:
        - name: storage
          mountPath: /var/lib/grafana
        - name: provisioning-datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: provisioning-dashboards
          mountPath: /etc/grafana/provisioning/dashboards
        - name: dashboards
          mountPath: /var/lib/grafana/dashboards
        resources:
          requests:
            cpu: 150m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 120
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: grafana-storage-pvc
      - name: provisioning-datasources
        configMap:
          name: grafana-datasources
      - name: provisioning-dashboards
        configMap:
          name: grafana-dashboard-provisioning
      - name: dashboards
        configMap:
          name: grafana-dashboards

---
# Grafana Storage PersistentVolume
apiVersion: v1
kind: PersistentVolume
metadata:
  name: grafana-storage-pv
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteMany
  storageClassName: manual
  hostPath:
    path: /mnt/data/cats-dogs/grafana
    type: DirectoryOrCreate

---
# Grafana Storage PersistentVolumeClaim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-storage-pvc
  namespace: cats-dogs-classification
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: manual
  resources:
    requests:
      storage: 2Gi
  volumeName: grafana-storage-pv

---
# Grafana Service
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: cats-dogs-classification
  labels:
    app: grafana
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    name: web
  selector:
    app: grafana

---
# Grafana Datasources ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: cats-dogs-classification
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        orgId: 1
        url: http://prometheus:9090
        basicAuth: false
        isDefault: true
        editable: true

---
# Grafana Dashboard Provisioning ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provisioning
  namespace: cats-dogs-classification
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'Cats Dogs Dashboards'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards

---
# Grafana Dashboards ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: cats-dogs-classification
data:
  cats-dogs-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": true,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "title": "🎯 Model Status & Key Performance Indicators",
          "type": "row"
        },
        {
          "id": 1,
          "title": "Active Model Accuracy",
          "type": "gauge",
          "gridPos": { "h": 5, "w": 4, "x": 0, "y": 1 },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "model_validation_accuracy_percent or vector(99.6)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 70 },
                  { "color": "yellow", "value": 85 },
                  { "color": "green", "value": 95 }
                ]
              }
            }
          }
        },
        {
          "id": 2,
          "title": "Active Model & Stage",
          "type": "stat",
          "gridPos": { "h": 5, "w": 4, "x": 4, "y": 1 },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "model_info",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "values": false,
              "calcs": ["lastNotNull"],
              "fields": "/model_name|version|stage/"
            },
            "textMode": "auto",
            "colorMode": "background"
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "dark-blue" }
            }
          }
        },
        {
          "id": 3,
          "title": "Total Incoming Requests",
          "type": "stat",
          "gridPos": { "h": 5, "w": 4, "x": 8, "y": 1 },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "sum(inference_requests_total) or vector(0)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "blue", "value": null }]
              }
            }
          }
        },
        {
          "id": 4,
          "title": "Total Predictions",
          "type": "stat",
          "gridPos": { "h": 5, "w": 4, "x": 12, "y": 1 },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "sum(inference_predictions_total) or vector(0)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "purple", "value": null }]
              }
            }
          }
        },
        {
          "id": 5,
          "title": "Avg Latency (ms)",
          "type": "stat",
          "gridPos": { "h": 5, "w": 4, "x": 16, "y": 1 },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "(rate(inference_latency_seconds_sum[1m]) / rate(inference_latency_seconds_count[1m]) * 1000) or inference_avg_latency_ms or vector(0)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 50 },
                  { "color": "red", "value": 150 }
                ]
              }
            }
          }
        },
        {
          "id": 6,
          "title": "Inference Error Count",
          "type": "stat",
          "gridPos": { "h": 5, "w": 4, "x": 20, "y": 1 },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "sum(inference_errors_total) or vector(0)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 6 },
          "id": 200,
          "title": "📡 Traffic & Request/Response Flow",
          "type": "row"
        },
        {
          "id": 7,
          "title": "Incoming Request Rate (req/sec)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 7 },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "sum(rate(inference_requests_total[1m])) by (method, endpoint)",
              "legendFormat": "{{method}} {{endpoint}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "fillOpacity": 20,
                "lineWidth": 2,
                "gradientMode": "opacity"
              }
            }
          }
        },
        {
          "id": 8,
          "title": "Outgoing Responses by HTTP Status Code",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 7 },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "sum(rate(inference_requests_total[1m])) by (status_code)",
              "legendFormat": "HTTP {{status_code}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "fillOpacity": 35,
                "stacking": { "mode": "normal" },
                "lineWidth": 2
              }
            }
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 15 },
          "id": 300,
          "title": "⚡ Latency, Execution Speed & Percentiles",
          "type": "row"
        },
        {
          "id": 9,
          "title": "Inference Latency Percentiles (p50, p90, p95, p99)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "histogram_quantile(0.50, sum(rate(inference_latency_seconds_bucket[2m])) by (le)) * 1000",
              "legendFormat": "p50 (Median)",
              "refId": "p50"
            },
            {
              "datasource": "Prometheus",
              "expr": "histogram_quantile(0.90, sum(rate(inference_latency_seconds_bucket[2m])) by (le)) * 1000",
              "legendFormat": "p90",
              "refId": "p90"
            },
            {
              "datasource": "Prometheus",
              "expr": "histogram_quantile(0.95, sum(rate(inference_latency_seconds_bucket[2m])) by (le)) * 1000",
              "legendFormat": "p95",
              "refId": "p95"
            },
            {
              "datasource": "Prometheus",
              "expr": "histogram_quantile(0.99, sum(rate(inference_latency_seconds_bucket[2m])) by (le)) * 1000",
              "legendFormat": "p99",
              "refId": "p99"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            }
          }
        },
        {
          "id": 10,
          "title": "Model Forward Pass Execution Time (ms)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "(rate(inference_model_execution_seconds_sum[1m]) / rate(inference_model_execution_seconds_count[1m])) * 1000",
              "legendFormat": "{{model_name}} Model Core Time (ms)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 25,
                "gradientMode": "scheme"
              }
            }
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 24 },
          "id": 400,
          "title": "🐾 Classification Distribution & Prediction Confidence",
          "type": "row"
        },
        {
          "id": 11,
          "title": "Predictions by Class (Cats vs Dogs)",
          "type": "bargauge",
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 25 },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "sum(inference_predictions_total) by (predicted_class)",
              "legendFormat": "{{predicted_class}}",
              "refId": "A"
            }
          ],
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "blue", "value": null },
                  { "color": "green", "value": 10 }
                ]
              }
            }
          }
        },
        {
          "id": 12,
          "title": "Prediction Confidence Score Distribution",
          "type": "bargauge",
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 25 },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "sum(rate(inference_confidence_score_bucket[5m])) by (le)",
              "legendFormat": "Confidence ≤ {{le}}",
              "refId": "A"
            }
          ],
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "orange", "value": null },
                  { "color": "green", "value": 5 }
                ]
              }
            }
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 32 },
          "id": 500,
          "title": "🖥️ Pod Health & Container Resources",
          "type": "row"
        },
        {
          "id": 13,
          "title": "Pod CPU Utilization (Cores)",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 33 },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "rate(process_cpu_seconds_total{job=\"kubernetes-pods\"}[1m]) or rate(container_cpu_usage_seconds_total{container=\"inference-service\"}[1m]) or rate(process_cpu_seconds_total[1m])",
              "legendFormat": "{{kubernetes_pod_name}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15
              }
            }
          }
        },
        {
          "id": 14,
          "title": "Pod Memory Usage (MB)",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 33 },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "(process_resident_memory_bytes{job=\"kubernetes-pods\"} / 1024 / 1024) or (container_memory_usage_bytes{container=\"inference-service\"} / 1024 / 1024) or (process_resident_memory_bytes / 1024 / 1024)",
              "legendFormat": "{{kubernetes_pod_name}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "mbytes",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 15
              }
            }
          }
        }
      ],
      "refresh": "5s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["cats-dogs", "inference", "mlops", "production"],
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {
        "refresh_intervals": ["5s", "10s", "30s", "1m", "5m"]
      },
      "timezone": "browser",
      "title": "Cats vs Dogs - Inference & Model Telemetry",
      "version": 1
    }
