stages:
  prepare:
    cmd: python src/scripts/prepare_data.py
    deps:
      - data/raw
    outs:
      - data/processed:
          cache: true

  train:
    cmd: python src/scripts/train.py --epochs 20 --batch-size 32
    deps:
      - src/models
      - src/data
      - data/processed
    params:
      - train.epochs
      - train.batch_size
      - train.learning_rate
    outs:
      - models/best_model:
          cache: true
    metrics:
      - models/best_model/model_comparison.json:
          cache: false