stages:
  prepare:
    cmd: python src/scripts/prepare_data.py
    deps:
      - data/raw
    outs:
      - data/processed:
          cache: true

  train:
    cmd: python src/scripts/train.py --compare-models --epochs 20 --batch-size 32
    deps:
      - src/models
      - src/data
      - data/processed
    params:
      - train.epochs
      - train.batch_size
      - train.lr
    outs:
      - models/model.pkl:
          cache: true
    metrics:
      - models/training_history.json:
          cache: false
